name: Release
on:
  release:
    types:
      - created
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  publish_on_win:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    - name: install Rust (required to build velopack_flutter native assets)
      uses: dtolnay/rust-toolchain@stable
    - name: install vpk (Velopack CLI)
      run: dotnet tool install -g vpk
    - name: building for windows
      run: flutter build windows
    - name: verify sqlite3 is bundled (prevents broken installers)
      run: |
        $dll = 'build\windows\x64\runner\Release\sqlite3.dll'
        if (-not (Test-Path $dll)) {
          # Defensive copy from the native-assets staging dir in case the
          # CMake install step changes format.
          $staged = Get-ChildItem -Recurse -Filter 'sqlite3.dll' build\native_assets -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($staged) { Copy-Item $staged.FullName $dll }
        }
        if (-not (Test-Path $dll)) {
          throw "sqlite3.dll is missing from the release bundle; the app would crash on startup with 'Couldn't resolve native function sqlite3_initialize' (see https://github.com/simolus3/sqlite3.dart/issues/353)"
        }
        Write-Host "sqlite3.dll present in bundle: $dll"
    - name: download previous velopack release (source for delta packages)
      run: vpk download github --repoUrl https://github.com/jonathanmajh/iko_reliability --token $env:GITHUB_TOKEN
      # on the FIRST velopack release there is nothing to chain deltas from
      # and the command aborts, so a failure here must not block the release
      continue-on-error: true
    - name: build Velopack release
      run: |
        $version = $env:GITHUB_REF_NAME.substring(1)
        Write-Host Version: $version
        vpk pack `
          --packId iko_reliability_flutter `
          --packVersion $version `
          --packDir build/windows/x64/runner/Release `
          --mainExe iko_reliability_flutter.exe `
          --packTitle "IKO Reliability PM Tool" `
          --packAuthors Jonathan `
          --icon iko_logo.ico `
          --splashImage iko_logo.gif `
          --runtime win-x64
    - name: publish release to GitHub Releases
      run: |
        vpk upload github `
          --repoUrl https://github.com/jonathanmajh/iko_reliability `
          --publish `
          --releaseName "IKO Reliability PM Tool $env:GITHUB_REF_NAME" `
          --tag $env:GITHUB_REF_NAME `
          --token $env:GITHUB_TOKEN
